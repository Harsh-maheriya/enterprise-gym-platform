# ==============================================================
# NATIVE ENVIRONMENT VARIABLE LOADING
# ==============================================================
# Tells Spring Boot to natively load our .env file without any plugins
spring.config.import=optional:file:.env[.properties]

# ==============================================================
# NEON CLOUD DATABASE CONFIGURATION (SECURED)
# ==============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================
# FLYWAY MIGRATION CONFIGURATION
# ==============================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ==============================================================
# UPSTASH CLOUD REDIS CONFIGURATION (SECURED)
# ==============================================================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}
